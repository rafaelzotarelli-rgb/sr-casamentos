version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Espera uma semana antes de propor versões novas (proteção contra pacotes comprometidos).
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint ainda não suporta TypeScript 7 (docs/decisoes.md, D18).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Os tipos acompanham a versão do Node usada no projeto e no CI (24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
