<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      background: #faf7f2;
      font-family: Arial, Helvetica, sans-serif;
      color: #221e1b;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 480px;
              background: #ffffff;
              border: 1px solid #e3dad0;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 16px;
                    font-family: Georgia, serif;
                    font-size: 24px;
                    color: #7a2e4f;
                  "
                >
                  Sr. Casamentos
                </p>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 24px">
                  Use o código abaixo para confirmar seu e-mail e entrar:
                </p>
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 32px;
                    letter-spacing: 8px;
                    font-weight: bold;
                    text-align: center;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 24px; font-size: 16px; line-height: 24px">
                  Ou, se estiver no mesmo navegador em que pediu o acesso:
                </p>
                <p style="margin: 0 0 24px; text-align: center">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="
                      display: inline-block;
                      background: #7a2e4f;
                      color: #ffffff;
                      text-decoration: none;
                      padding: 12px 24px;
                      border-radius: 10px;
                      font-weight: bold;
                    "
                  >
                    Confirmar e entrar
                  </a>
                </p>
                <p style="margin: 0; font-size: 14px; line-height: 20px; color: #6a6058">
                  O código vale por 1 hora. Se você não pediu este acesso, ignore este e-mail.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
